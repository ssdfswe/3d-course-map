<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>三明学院 - 服装与服饰设计 3D交互课程星系 + 侧边栏</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background-color: #03040b; font-family: "Microsoft YaHei", sans-serif; }

        /* ===== 3D 文字标签 ===== */
        .node-label {
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(10, 20, 40, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.3s ease;
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .node-title { font-size: 13px; font-weight: bold; color: #e0f7fa; }
        .node-desc { font-size: 10px; color: #80cbc4; margin-top: 2px; }

        .c-root { border-color: #ffeb3b; box-shadow: 0 0 20px rgba(255, 235, 59, 0.5); }
        .c-base { border-color: #00e5ff; }
        .c-core { border-color: #4facfe; }
        .c-fashion { border-color: #ff4081; }
        .c-shoes { border-color: #b388ff; }
        .c-practice { border-color: #ff9800; }

        /* ===== 顶部提示 ===== */
        #ui-tip {
            position: absolute; top: 20px; left: 0; width: 100%; text-align: center;
            color: rgba(255,255,255,0.6); font-size: 15px; letter-spacing: 2px;
            pointer-events: none; z-index: 100;
        }

        /* ===== 侧边栏 ===== */
        #sidebar {
            position: fixed;
            top: 0; right: 0;
            width: 360px;
            height: 100vh;
            background: rgba(6, 12, 24, 0.92);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(0, 200, 255, 0.25);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.6);
            color: #d7f0ff;
            z-index: 200;
            display: flex;
            flex-direction: column;
            font-size: 13px;
            transition: transform 0.35s ease;
        }
        #sidebar.hidden { transform: translateX(100%); }

        #sidebar-header {
            padding: 16px 18px 12px;
            border-bottom: 1px solid rgba(0, 200, 255, 0.15);
            flex-shrink: 0;
        }
        #sidebar-header h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #8be9fd;
            letter-spacing: 1px;
        }
        #sidebar-header p {
            margin: 6px 0 0;
            font-size: 11px;
            color: #5f8aa8;
        }

        #sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px 24px;
        }
        #sidebar-body::-webkit-scrollbar { width: 5px; }
        #sidebar-body::-webkit-scrollbar-thumb { background: rgba(0, 200, 255, 0.3); border-radius: 4px; }

        .empty-hint {
            padding: 40px 10px;
            text-align: center;
            color: #3a5a70;
            font-size: 12px;
            line-height: 1.8;
        }

        /* 侧边栏条目 */
        .sb-node {
            margin-bottom: 6px;
            border-radius: 8px;
            background: rgba(15, 30, 50, 0.6);
            border: 1px solid rgba(0, 180, 255, 0.12);
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .sb-node.active-parent { border-color: rgba(0, 220, 255, 0.45); }

        .sb-row {
            display: flex;
            align-items: center;
            padding: 9px 12px;
            cursor: pointer;
            gap: 8px;
            user-select: none;
            transition: background 0.15s;
        }
        .sb-row:hover { background: rgba(0, 180, 255, 0.08); }

        .sb-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .sb-name {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
            color: #c8e6f8;
        }
        .sb-credit {
            font-size: 10px;
            color: #5a8da8;
            flex-shrink: 0;
            margin-right: 4px;
        }
        .sb-toggle {
            width: 18px; height: 18px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px;
            background: rgba(0, 180, 255, 0.12);
            color: #6ac8f0;
            font-size: 11px;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .sb-toggle:hover { background: rgba(0, 220, 255, 0.25); }

        /* 子节点资料区 */
        .sb-detail {
            display: none;
            padding: 4px 12px 10px 30px;
            border-top: 1px dashed rgba(0, 180, 255, 0.12);
        }
        .sb-node.expanded .sb-detail { display: block; }
        .sb-node.expanded > .sb-row .sb-toggle { background: rgba(0, 220, 255, 0.35); }

        .sb-desc {
            font-size: 11px;
            color: #7fb3cc;
            line-height: 1.65;
            margin-bottom: 6px;
        }
        .sb-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
        }
        .sb-tag {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 10px;
            background: rgba(0, 150, 255, 0.1);
            color: #6ac8f0;
            border: 1px solid rgba(0, 180, 255, 0.15);
        }

        /* 子课程条目（最内层资料） */
        .sb-leaf {
            padding: 6px 0 4px 6px;
            border-left: 2px solid rgba(0, 180, 255, 0.15);
            margin-left: 2px;
            margin-top: 6px;
        }
        .sb-leaf-title {
            font-size: 12px;
            font-weight: 500;
            color: #a8d8f0;
            margin-bottom: 2px;
        }
        .sb-leaf-desc {
            font-size: 10.5px;
            color: #5f8aa8;
            line-height: 1.55;
        }

        /* 侧边栏开关按钮 */
        #sb-toggle-btn {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            width: 28px;
            height: 64px;
            background: rgba(0, 180, 255, 0.15);
            border: 1px solid rgba(0, 200, 255, 0.3);
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: #6ac8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 201;
            font-size: 14px;
            transition: background 0.2s;
        }
        #sb-toggle-btn:hover { background: rgba(0, 220, 255, 0.3); }
        #sidebar:not(.hidden) ~ #sb-toggle-btn { display: none; }

        /* 顶部关闭按钮 */
        #sb-close {
            position: absolute;
            top: 14px; right: 14px;
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            background: rgba(255,255,255,0.06);
            color: #6ac8f0;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        #sb-close:hover { background: rgba(255,255,255,0.15); }
    </style>
</head>

        // ============================================================
        // 2. 初始化 Three.js 环境
        // ============================================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x03040b, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 50;
        controls.minDistance = 5;

        // ============================================================
        // 【新增】星系组：用于统一移动整个星系
        // ============================================================
        const galaxyGroup = new THREE.Group();
        scene.add(galaxyGroup);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.PointLight(0xffffff, 200, 100);
        light.position.set(10, 20, 10);
        scene.add(light); // 灯光不受移动影响

        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(3000 * 3);
        for (let i = 0; i < 3000 * 3; i++) starPos[i] = (Math.random() - 0.5) * 150;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.6 }));
        
        // 【修改】将星空加入星系组
        galaxyGroup.add(stars); 

        // ============================================================
        // 3. 3D 节点管理
        // ============================================================
        const nodes = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function createNode(data, parentPos = new THREE.Vector3(0, 0, 0), depth = 0) {
            const nodeGroup = new THREE.Group();
            nodeGroup.position.copy(parentPos);

            const geometry = new THREE.SphereGeometry(data.size, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: data.color,
                emissive: data.color,
                emissiveIntensity: 0.4,
                roughness: 0.2,
                metalness: 0.8,
                transparent: true,
                opacity: 0.9
            });
            const sphere = new THREE.Mesh(geometry, material);

            sphere.userData = {
                isNode: true,
                data: data,
                expanded: false,
                childMeshes: [],
                childLines: [],
                group: nodeGroup,
                labelDiv: null
            };

            nodeGroup.add(sphere);
            nodes.push(sphere);

            const labelDiv = document.createElement('div');
            labelDiv.className = `node-label ${data.theme || 'c-core'}`;
            labelDiv.innerHTML = `<div class="node-title">${data.name}</div><div class="node-desc">${data.desc || ''}</div>`;
            const label = new CSS2DObject(labelDiv);
            label.position.set(0, data.size + 0.15, 0);
            sphere.add(label);
            sphere.userData.labelDiv = labelDiv;

            // 【修改】加入星系组
            galaxyGroup.add(nodeGroup);
            return sphere;
        }

        const rootNode = createNode(courseTree);

        // ---------- 展开 / 收回（3D + 侧边栏联动） ----------
        let sidebarSyncLock = false;

        function toggleNode(sphere, fromSidebar = false) {
            if (!sphere.userData.data.children || sphere.userData.data.children.length === 0) return;

            const isExpanded = sphere.userData.expanded;
            const data = sphere.userData.data;

            if (!isExpanded) {
                // ====== 展开 ======
                sphere.userData.expanded = true;
                const parentWorldPos = sphere.getWorldPosition(new THREE.Vector3());
                const count = data.children.length;
                const radius = 6 + count * 0.5;

                data.children.forEach((childData, index) => {
                    const phi = Math.acos(-1 + (2 * index) / count);
                    const theta = Math.sqrt(count * Math.PI) * phi;
                    const x = radius * Math.cos(theta) * Math.sin(phi);
                    const y = radius * Math.sin(theta) * Math.sin(phi);
                    const z = radius * Math.cos(phi);

                    // 注意这里：如果星系组移动了，getWorldPosition 已经包含了星系组的位移，所以这里算出来的 childPos 是全局坐标，
                    // 但我们把子球加入的是 galaxyGroup，所以需要抵消 galaxyGroup 的位移，或者直接使用相对坐标。
                    // 为了简单和稳妥，我们直接把星系组不设偏移，所有坐标都在世界坐标系下计算。
                    // 如果 galaxiesGroup.position 改变，那么 parentWorldPos 包含了改变，而直接赋给 childSphere 也是相对于 galaxyGroup 的偏移。
                    // 所以需要减去 galaxyGroup.position。
                    const groupPos = galaxyGroup.position;
                    const childLocalPos = new THREE.Vector3(
                        parentWorldPos.x - groupPos.x + x, 
                        parentWorldPos.y - groupPos.y + y, 
                        parentWorldPos.z - groupPos.z + z
                    );
                    
                    const childSphere = createNode(childData, childLocalPos, 1);

                    // 绘制线，使用局部坐标
                    const parentLocalPos = new THREE.Vector3(
                        parentWorldPos.x - groupPos.x,
                        parentWorldPos.y - groupPos.y,
                        parentWorldPos.z - groupPos.z
                    );
                    const points = [parentLocalPos, childLocalPos];
                    const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                    const lineMat = new THREE.LineBasicMaterial({ color: sphere.material.color, transparent: true, opacity: 0.35 });
                    const line = new THREE.Line(lineGeo, lineMat);
                    
                    // 【修改】加入星系组
                    galaxyGroup.add(line);

                    sphere.userData.childMeshes.push(childSphere);
                    sphere.userData.childLines.push(line);

                    // 缩放动画
                    childSphere.scale.set(0, 0, 0);
                    let scale = 0;
                    (function scaleUp() {
                        scale += 0.08;
                        if (scale >= 1) { childSphere.scale.set(1, 1, 1); return; }
                        childSphere.scale.set(scale, scale, scale);
                        requestAnimationFrame(scaleUp);
                    })();
                });

                if (!fromSidebar) buildSidebarFor(sphere, true);

            } else {
                // ====== 收回 ======
                sphere.userData.expanded = false;

                sphere.userData.childMeshes.forEach(child => {
                    if (child.userData.expanded) toggleNode(child, true);

                    const idx = nodes.indexOf(child);
                    if (idx > -1) nodes.splice(idx, 1);

                    if (child.userData.labelDiv) {
                        child.userData.labelDiv.style.opacity = 0;
                        setTimeout(() => {
                            if (child.userData.labelDiv && child.userData.labelDiv.parentNode)
                                child.userData.labelDiv.parentNode.removeChild(child.userData.labelDiv);
                        }, 300);
                    }

                    let s = 1;
                    (function scaleDown() {
                        s -= 0.1;
                        if (s <= 0) { 
                            // 【修改】从星系组移除
                            galaxyGroup.remove(child.parent); 
                            return; 
                        }
                        child.scale.set(s, s, s);
                        requestAnimationFrame(scaleDown);
                    })();
                });

                sphere.userData.childLines.forEach(line => {
                    // 【修改】从星系组移除
                    galaxyGroup.remove(line);
                    line.geometry.dispose();
                    line.material.dispose();
                });

                sphere.userData.childMeshes = [];
                sphere.userData.childLines = [];

                if (!fromSidebar) buildSidebarFor(sphere, false);
            }
        }

        // ============================================================
        // 4. 侧边栏逻辑
        // ============================================================
        const sidebar = document.getElementById('sidebar');
        const sidebarBody = document.getElementById('sidebar-body');
        const sbEmpty = document.getElementById('sb-empty');
        const sbToggleBtn = document.getElementById('sb-toggle-btn');
        const sbClose = document.getElementById('sb-close');

        sbToggleBtn.addEventListener('click', () => sidebar.classList.remove('hidden'));
        sbClose.addEventListener('click', () => sidebar.classList.add('hidden'));

        function findSidebarNode(key) {
            return sidebarBody.querySelector(`.sb-node[data-key="${key}"]`);
        }

        function buildSidebarFor(sphere, expand) {
            if (sidebarSyncLock) return;
            sidebarSyncLock = true;

            const key = sphere.userData.data.name + '|' + (sphere.userData.data.desc || '');
            let nodeEl = findSidebarNode(key);

            if (expand) {
                sbEmpty.style.display = 'none';

                if (!nodeEl) {
                    nodeEl = createSidebarNode(sphere);
                    const depth = getDepth(sphere);
                    if (depth === 1) {
                        sidebarBody.appendChild(nodeEl);
                    } else {
                        const parentSphere = findParentSphere(sphere);
                        if (parentSphere) {
                            const parentKey = parentSphere.userData.data.name + '|' + (parentSphere.userData.data.desc || '');
                            const parentEl = findSidebarNode(parentKey);
                            if (parentEl) {
                                let container = parentEl.querySelector('.sb-detail');
                                if (!container) {
                                    container = document.createElement('div');
                                    container.className = 'sb-detail';
                                    parentEl.appendChild(container);
                                }
                                container.appendChild(nodeEl);
                            }
                        }
                    }
                }

                nodeEl.classList.add('expanded');
                nodeEl.classList.add('active-parent');

                const toggle = nodeEl.querySelector('.sb-toggle');
                if (toggle) toggle.textContent = '▼';

                if (sphere.userData.childMeshes.length > 0) {
                    sphere.userData.childMeshes.forEach(child => {
                        if (child.userData.expanded) buildSidebarFor(child, true);
                    });
                }

            } else {
                if (nodeEl) {
                    nodeEl.classList.remove('expanded');
                    nodeEl.classList.remove('active-parent');
                    const toggle = nodeEl.querySelector('.sb-toggle');
                    if (toggle) toggle.textContent = '▶';
                }

                requestAnimationFrame(() => {
                    const anyExpanded = sidebarBody.querySelector('.sb-node.active-parent');
                    if (!anyExpanded) {
                        sidebarBody.innerHTML = '';
                        sidebarBody.appendChild(sbEmpty);
                        sbEmpty.style.display = 'block';
                    }
                });
            }

            setTimeout(() => { sidebarSyncLock = false; }, 50);
        }

        function getDepth(sphere) {
            let d = 0, s = sphere;
            while (s.parent && !s.userData.isRoot) {
                let p = null;
                nodes.forEach(n => {
                    if (n.userData.childMeshes.includes(s)) p = n;
                });
                if (!p) break;
                s = p;
                d++;
            }
            return d;
        }

        function findParentSphere(sphere) {
            for (const n of nodes) {
                if (n.userData.childMeshes.includes(sphere)) return n;
            }
            return null;
        }

        function createSidebarNode(sphere) {
            const data = sphere.userData.data;
            const el = document.createElement('div');
            el.className = 'sb-node';
            el.dataset.key = data.name + '|' + (data.desc || '');

            const row = document.createElement('div');
            row.className = 'sb-row';

            const dot = document.createElement('span');
            dot.className = 'sb-dot';
            dot.style.background = '#' + data.color.toString(16).padStart(6, '0');
            dot.style.boxShadow = '0 0 6px #' + data.color.toString(16).padStart(6, '0');

            const name = document.createElement('span');
            name.className = 'sb-name';
            name.textContent = data.name;

            const credit = document.createElement('span');
            credit.className = 'sb-credit';
            credit.textContent = (data.desc || '').replace(/·/g, '').trim();

            const toggle = document.createElement('span');
            toggle.className = 'sb-toggle';
            toggle.textContent = '▼';

            row.appendChild(dot);
            row.appendChild(name);
            row.appendChild(credit);
            row.appendChild(toggle);
            el.appendChild(row);

            const detail = document.createElement('div');
            detail.className = 'sb-detail';

            if (data.detail) {
                const desc = document.createElement('div');
                desc.className = 'sb-desc';
                desc.textContent = data.detail;
                detail.appendChild(desc);
            }

            if (data.children) {
                data.children.forEach(child => {
                    const leaf = document.createElement('div');
                    leaf.className = 'sb-leaf';
                    leaf.innerHTML = `
                        <div class="sb-leaf-title">▸ ${child.name}
                            <span style="font-weight:400;font-size:10px;color:#5a8da8;margin-left:6px;">${child.desc || ''}</span>
                        </div>
                        <div class="sb-leaf-desc">${child.desc2 || ''}</div>
                    `;
                    detail.appendChild(leaf);
                });
            }

            el.appendChild(detail);

            row.addEventListener('click', (e) => {
                e.stopPropagation();
                const targetSphere = nodes.find(n => {
                    const d = n.userData.data;
                    return d.name === data.name && (d.desc || '') === (data.desc || '');
                });
                if (!targetSphere) return;
                if (!targetSphere.userData.data.children || targetSphere.userData.data.children.length === 0) return;

                sidebarSyncLock = true;
                toggleNode(targetSphere, true);
                sidebarSyncLock = false;
            });

            return el;
        }

        // ============================================================
        // 5. 鼠标事件：点击展开/收回 + 拖拽星系
        // ============================================================
        let mouseDownPos = { x: 0, y: 0 };
        // 新增：拖拽相关变量
        let isDraggingRoot = false;
        let lastDragMouseX = 0;
        let lastDragMouseY = 0;

        renderer.domElement.addEventListener('mousedown', (e) => {
            mouseDownPos = { x: e.clientX, y: e.clientY };
            
            // 检测按下时是否点中了根节点大球
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes);
            
            if (intersects.length > 0 && intersects[0].object === rootNode) {
                isDraggingRoot = true;
                lastDragMouseX = e.clientX;
                lastDragMouseY = e.clientY;
                controls.enabled = false; // 拖拽时禁用相机视角旋转
                document.body.style.cursor = 'grabbing';
            }
        });

        renderer.domElement.addEventListener('mouseup', (e) => {
            // 结束拖拽星系
            if (isDraggingRoot) {
                isDraggingRoot = false;
                controls.enabled = true;
                document.body.style.cursor = 'default';
            }

            const dx = e.clientX - mouseDownPos.x;
            const dy = e.clientY - mouseDownPos.y;
            if (Math.sqrt(dx * dx + dy * dy) > 5) return; // 移动距离过大说明是拖拽，不触发点击

            // 点击判定
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes);

            if (intersects.length > 0) {
                toggleNode(intersects[0].object, false);
            }
        });

        // 新增：处理星系拖拽的动画和鼠标悬停
        window.addEventListener('mousemove', (event) => {
            // 如果正在拖拽大球
            if (isDraggingRoot) {
                const deltaX = event.clientX - lastDragMouseX;
                const deltaY = event.clientY - lastDragMouseY;

                // 动态计算比例，将屏幕像素位移映射到 3D 世界坐标位移
                const distance = camera.position.distanceTo(galaxyGroup.position); 
                const vFOV = camera.fov * Math.PI / 180;
                const viewHeight = 2 * Math.tan(vFOV / 2) * distance;
                const viewWidth = viewHeight * camera.aspect;
                const pixelToWorldX = viewWidth / window.innerWidth;
                const pixelToWorldY = viewHeight / window.innerHeight;

                // 获取相机当前朝向的右向量和上向量
                const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
                const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);

                // 将鼠标拖拽映射到 3D 空间，并平移整个星系组
                galaxyGroup.position.addScaledVector(right, deltaX * pixelToWorldX);
                galaxyGroup.position.addScaledVector(up, -deltaY * pixelToWorldY);

                lastDragMouseX = event.clientX;
                lastDragMouseY = event.clientY;
                return; // 拖拽时阻断后续的射线检测
            }

            if (event.buttons > 0) return; // 拖拽相机视角时也不检测悬停

            // 悬停高亮逻辑
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes);
            if (intersects.length > 0) {
                document.body.style.cursor = 'pointer';
                intersects[0].object.material.emissiveIntensity = 1.0;
            } else {
                document.body.style.cursor = 'default';
            }
        });

        // ============================================================
        // 6. 动画循环
        // ============================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            nodes.forEach((node, i) => {
                node.material.emissiveIntensity = 0.4 + Math.sin(time * 3 + i) * 0.15;
                if (!node.userData.expanded) {
                    const s = 1 + Math.sin(time * 3 + i) * 0.02;
                    node.scale.set(s, s, s);
                }
            });

            stars.rotation.y = time * 0.02;
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        animate();

        // ============================================================
        // 7. 自适应
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
